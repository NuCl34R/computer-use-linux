<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc">
<title id="title">Two desktops, one machine</title><desc id="desc">An agent harness connects to a persistent controller via MCP or JSON CLI. Private mode creates an independent agent desktop, while current mode uses native APIs to control existing windows.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#26302f" stroke-width=".5"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#b8f774"/></marker></defs>
<rect width="1120" height="460" rx="16" fill="#0b0f12"/><rect width="1120" height="460" rx="16" fill="url(#grid)"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="40" y="46" fill="#b8f774" font-size="12" letter-spacing="2">SYSTEM MAP / LOCAL CONTROL</text><text x="40" y="86" fill="#f5f1e8" font-size="28" font-weight="700">One interface. Two ways to work.</text>
<rect x="40" y="177" width="222" height="164" rx="10" fill="#151d20" stroke="#394540"/><text x="62" y="211" fill="#b8f774" font-size="12" letter-spacing="1">01 / HARNESS</text><text x="62" y="245" fill="#f5f1e8" font-size="22" font-weight="700">Your agent</text><text x="62" y="277" fill="#b5bdb8" font-size="15">MCP stdio or JSON CLI</text><text x="62" y="305" fill="#b5bdb8" font-size="15">Your choice of model</text>
<path d="M262 259H333" fill="none" stroke="#b8f774" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="348" y="155" width="294" height="208" rx="10" fill="#17211d" stroke="#b8f774"/><text x="370" y="190" fill="#b8f774" font-size="12" letter-spacing="1">02 / CONTROLLER</text><text x="370" y="226" fill="#f5f1e8" font-size="22" font-weight="700">Linux Computer Use</text><text x="370" y="259" fill="#b5bdb8" font-size="15">Observe · act · verify</text><text x="370" y="290" fill="#b5bdb8" font-size="15">Pixels + accessibility + input</text><text x="370" y="328" fill="#b8f774" font-size="13">19 TOOLS / PERSISTENT SESSION</text>
<path d="M642 259H684V199H729 M684 259V333H729" fill="none" stroke="#b8f774" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="744" y="137" width="336" height="123" rx="10" fill="#17211d" stroke="#66824c"/><text x="766" y="168" fill="#b8f774" font-size="12" letter-spacing="1">03 A / PRIVATE DESKTOP</text><text x="766" y="198" fill="#f5f1e8" font-size="20" font-weight="700">You work. The agent works.</text><text x="766" y="226" fill="#b5bdb8" font-size="14">Separate display, focus and clipboard</text><text x="766" y="246" fill="#b5bdb8" font-size="12">KWin · Sway · Hyprland · Xvfb</text>
<rect x="744" y="279" width="336" height="107" rx="10" fill="#1e1c18" stroke="#776249"/><text x="766" y="310" fill="#f2b66d" font-size="12" letter-spacing="1">03 B / EXISTING DESKTOP</text><text x="766" y="340" fill="#f5f1e8" font-size="20" font-weight="700">Control your open windows.</text><text x="766" y="367" fill="#b5bdb8" font-size="14">Portal · Wayland protocols · XTEST</text>
<text x="40" y="424" fill="#84948d" font-size="12" letter-spacing=".5">PRIVATE DISPLAY ≠ FILESYSTEM SANDBOX</text><text x="744" y="424" fill="#84948d" font-size="12">No hosted controller. No TCP listener.</text></g></svg>
